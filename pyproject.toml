[project]
name = "reasoning-bank"
version = "0.1.0"
description = "Framework-agnostic implementation of ReasoningBank (Ouyang et al., ICLR 2026): agents that learn from successful and failed trajectories, with memory-aware test-time scaling (MaTTS)."
authors = [{ name = "Rama Krishna Bachu", email = "ram@bottensor.xyz" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["reasoning-bank", "agent-memory", "llm-agents", "test-time-scaling", "matts", "self-evolving-agents", "reasoning-memory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "sqlite-vec>=0.1.6",
  "sentence-transformers>=3.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
polyrt = ["polyrt[anthropic]>=0.1.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/ramankrishna/reasoning-bank"
Repository = "https://github.com/ramankrishna/reasoning-bank"
Issues = "https://github.com/ramankrishna/reasoning-bank/issues"
Paper = "https://arxiv.org/abs/2509.25140"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reasoning_bank"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
