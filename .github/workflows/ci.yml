name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project + dev extras
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src tests

      - name: Mypy (best-effort)
        run: uv run mypy src
        continue-on-error: true

      - name: Pytest
        run: uv run pytest -q

      - name: Build wheel
        run: uv build --wheel

      - name: Wheel-prompts guard
        run: |
          set -euo pipefail
          WHEEL=$(ls dist/reasoning_bank-*.whl | head -1)
          echo "Inspecting $WHEEL"
          REQUIRED="induction_failure.txt induction_success.txt judge.txt matts_contrast.txt merge.txt"
          for f in $REQUIRED; do
            if ! unzip -l "$WHEEL" | grep -q "reasoning_bank/prompts/$f"; then
              echo "MISSING in wheel: prompts/$f"
              exit 1
            fi
          done
          echo "All 5 prompt files present in wheel."
